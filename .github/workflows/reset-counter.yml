name: Reset download counter

# Sets the download counter on the website back to zero (for example after
# your own test downloads). Run it from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          gh release delete counter --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          assets="download.txt click.txt iab.txt ios.txt visit-ig.txt visit-fb.txt visit-li.txt visit-tg.txt visit-other.txt"
          for f in $assets; do echo counter > "$f"; done
          gh release create counter $assets --repo "$GITHUB_REPOSITORY" \
            --title "Download counter" \
            --notes "Counts visits and downloads from the website. Do not delete: the numbers on /stats/ are these files' download counts."
